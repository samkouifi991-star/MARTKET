name: Temporary — Manual Data Entry Seed (Phase F)

# One-off, temporary workflow: drives the real /admin/data-entry form against
# production to seed real (web-searched, honestly-sourced) Forex Factory
# releases, since this sandbox cannot reach *.vercel.app directly. Deleted
# after use — not a permanent part of CI.
on:
  workflow_dispatch:
    inputs:
      qa_email:
        description: "QA admin email"
        required: true
      qa_password:
        description: "QA admin temporary password"
        required: true

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install playwright
        run: |
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
        working-directory: scripts/tmp-data-entry-seed
      - name: Run seed script
        working-directory: scripts/tmp-data-entry-seed
        env:
          SEED_QA_EMAIL: ${{ inputs.qa_email }}
          SEED_QA_PASSWORD: ${{ inputs.qa_password }}
        run: node run.js
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-results
          path: |
            scripts/tmp-data-entry-seed/shots/**
            scripts/tmp-data-entry-seed/results.json
          retention-days: 5
