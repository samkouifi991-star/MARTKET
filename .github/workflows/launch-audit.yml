# Phase 19 — one-off, manually-triggered runner for the public-launch
# readiness audit (GET /api/admin/launch-audit). This sandbox's own
# outbound network policy blocks *.vercel.app directly (see
# scorecard-diagnostic-screenshot.yml's header for the same limitation),
# so this reuses that workflow's pattern: a GitHub Actions runner
# (unrestricted egress) calls the real, deployed production endpoint and
# prints the raw JSON response directly into this job's own log between
# markers, read back via the GitHub Actions API instead of a direct
# fetch. Reuses the same APP_BASE_URL/EVENT_WATCH_SECRET repo secrets
# already configured for the other diagnostic workflows — nothing new to
# configure. Safe to delete once no longer needed.
name: Launch Readiness Audit

on:
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Call the launch-audit endpoint and print the result
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          AUDIT_SECRET: ${{ secrets.EVENT_WATCH_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$AUDIT_SECRET" ]; then
            echo "APP_BASE_URL or AUDIT_SECRET (EVENT_WATCH_SECRET) is not set."
            exit 1
          fi
          echo "BEGIN_AUDIT_JSON"
          http_status=$(curl -sS -L -D headers.txt -o response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${AUDIT_SECRET}" \
            "${APP_BASE_URL}/api/admin/launch-audit")
          echo "HTTP_STATUS: ${http_status}"
          echo "BEGIN_HEADERS"
          cat headers.txt
          echo "END_HEADERS"
          cat response.json
          echo ""
          echo "END_AUDIT_JSON"
          if [ "$http_status" != "200" ]; then
            exit 1
          fi
