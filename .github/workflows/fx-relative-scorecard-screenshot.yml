# One-off, manually-triggered Playwright screenshot capture for the FX
# Relative Scorecard verification (base + quote economy comparison on
# Growth/Inflation/Labor/Rates). This sandbox's own outbound network policy
# blocks *.vercel.app AND the Actions artifact blob-storage host directly,
# so this reuses the established pattern from the other diagnostic
# workflows in this repo — but even further: instead of an uploaded
# artifact (unreachable), each screenshot is base64-encoded and printed
# directly into this job's own log between markers, read back via the
# GitHub Actions API (get_job_logs) exactly like launch-audit.yml's JSON
# result. Uses the same read-only diagnostics/scorecard/[symbol] route
# (gated by EVENT_WATCH_SECRET, same repo secret already configured for the
# other diagnostic workflows) that renders the exact same Scorecard
# component a real logged-in customer sees — no test account or session
# needed. Safe to delete once no longer needed.
name: FX Relative Scorecard Screenshot

on:
  workflow_dispatch: {}

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (Chromium only)
        run: |
          npm install playwright@1.48.0
          npx playwright install --with-deps chromium
      - name: Screenshot the macro comparison section for each FX pair, base64 into the log
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          KEY: ${{ secrets.EVENT_WATCH_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$KEY" ]; then
            echo "APP_BASE_URL or KEY (EVENT_WATCH_SECRET) is not set."
            exit 1
          fi
          mkdir -p shots
          cat > shot.js <<'EOF'
          const { chromium } = require("playwright");
          const fs = require("fs");

          const symbols = ["USDJPY", "GBPJPY", "AUDUSD", "EURGBP"];

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            for (const symbol of symbols) {
              const url = `${process.env.APP_BASE_URL}/diagnostics/scorecard/${symbol}?key=${encodeURIComponent(process.env.KEY)}`;
              console.log(`Loading ${symbol}...`);
              // "load" not "networkidle" — this page auto-refreshes on an
              // interval, so network activity never truly goes idle.
              const response = await page.goto(url, { waitUntil: "load", timeout: 90000 });
              console.log(`${symbol}: HTTP ${response.status()}`);
              if (response.status() !== 200) {
                console.log(await page.content());
                throw new Error(`${symbol}: unexpected HTTP ${response.status()}`);
              }
              const macro = page.locator("#sc-macro");
              await macro.waitFor({ state: "attached", timeout: 30000 });
              await macro.scrollIntoViewIfNeeded();
              await page.waitForTimeout(500);
              await macro.screenshot({ path: `shots/${symbol}-macro.jpg`, type: "jpeg", quality: 55 });
              const rates = page.locator("#sc-rates");
              await rates.scrollIntoViewIfNeeded();
              await page.waitForTimeout(300);
              await rates.screenshot({ path: `shots/${symbol}-rates.jpg`, type: "jpeg", quality: 55 });
            }
            await browser.close();
            for (const symbol of symbols) {
              for (const part of ["macro", "rates"]) {
                const path = `shots/${symbol}-${part}.jpg`;
                const b64 = fs.readFileSync(path).toString("base64");
                console.log(`BEGIN_IMAGE ${symbol}-${part} bytes=${b64.length}`);
                console.log(b64);
                console.log(`END_IMAGE ${symbol}-${part}`);
              }
            }
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          node shot.js
