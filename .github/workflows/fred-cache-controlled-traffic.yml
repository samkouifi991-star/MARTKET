# One-off, manually-triggered controlled-traffic generator for verifying
# the FRED Macro-State cross-request cache (see
# services/market-data/last-known-good.ts's getCachedStoredEconomicSeries).
# Hits USDJPY's diagnostics/scorecard page twice back-to-back with no
# delay, to test whether the cache holds even within the same warm-lambda
# window (a tighter, more diagnostic test than a multi-round/multi-symbol
# burst). Compare economic_indicators call counts in pg_stat_statements
# before hit 1, between hit 1 and hit 2, and after hit 2. Safe to delete
# once no longer needed.
name: FRED Cache Controlled Traffic

on:
  workflow_dispatch: {}

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit USDJPY's Scorecard diagnostic page twice, back-to-back
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          KEY: ${{ secrets.EVENT_WATCH_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$KEY" ]; then
            echo "APP_BASE_URL or KEY (EVENT_WATCH_SECRET) is not set."
            exit 1
          fi
          ENCODED_KEY=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['KEY']))")
          echo "BEGIN_TRAFFIC"
          echo "MARKER: BEFORE_HIT_1 $(date -u +%s)"
          STATUS1=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "${APP_BASE_URL}/diagnostics/scorecard/USDJPY?key=${ENCODED_KEY}")
          echo "hit=1 http_code=${STATUS1} $(date -u +%s)"
          STATUS2=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "${APP_BASE_URL}/diagnostics/scorecard/USDJPY?key=${ENCODED_KEY}")
          echo "hit=2 http_code=${STATUS2} $(date -u +%s)"
          echo "END_TRAFFIC"
