# Temporary, one-off workflow for Phase 14 final QA. Runs the Playwright
# script in scripts/tmp-phase14-qa against real production (this sandbox
# has no direct network path to *.vercel.app), then commits the resulting
# screenshots + results.json to a dedicated orphan branch and pushes it —
# retrieved back into the sandbox via a normal `git fetch`/`git show`
# instead of the GH Actions artifact-download API, which this sandbox's
# egress policy has blocked before. Delete this workflow (and the
# qa/phase14-results branch) once no longer needed.
name: Phase 14 QA Screenshots

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright (Chromium only)
        working-directory: scripts/tmp-phase14-qa
        timeout-minutes: 5
        run: |
          npm install playwright@1.48.0
          npx playwright install chromium
      - name: Run Phase 14 QA script
        working-directory: scripts/tmp-phase14-qa
        timeout-minutes: 8
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          EVENT_WATCH_SECRET: ${{ secrets.EVENT_WATCH_SECRET }}
        run: node run.js
      - name: Publish results to a dedicated branch
        if: always()
        working-directory: scripts/tmp-phase14-qa
        run: |
          rm -rf /tmp/qa-publish
          mkdir -p /tmp/qa-publish
          cp -r shots /tmp/qa-publish/shots 2>/dev/null || true
          cp results.json /tmp/qa-publish/results.json 2>/dev/null || true
          cd /tmp/qa-publish
          git init -q
          git config user.name "phase14-qa-bot"
          git config user.email "phase14-qa-bot@users.noreply.github.com"
          git checkout -q -b qa/phase14-results
          git add -A
          git commit -q -m "Phase 14 QA run results"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push -q -f origin qa/phase14-results:qa/phase14-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
