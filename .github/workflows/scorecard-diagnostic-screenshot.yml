# One-off, manually-triggered verification job — NOT a scheduled/product
# workflow. This sandbox's own outbound network policy blocks
# *.vercel.app directly (and, it turns out, GitHub's own artifact blob
# storage host too), so this uses a GitHub Actions runner (unrestricted
# egress) as the channel to load the real, deployed
# /diagnostics/scorecard/[symbol] page (see that page's own header comment
# — secret-gated via a query param, not a customer session) in a real
# headless browser and capture what it actually rendered. Since the
# artifact download URL itself isn't reachable from that sandbox, the
# screenshot (JPEG, compressed) and the page's raw JSON diagnostic dump
# are ALSO printed directly to this job's own log (base64 for the image,
# between clear markers) so they can be read back via the GitHub Actions
# API instead of a direct blob fetch. The artifact upload stays too, as a
# normal way for a human to grab the files from the Actions UI.
# Reuses the same EVENT_WATCH_SECRET/APP_BASE_URL secrets already
# configured for the Economic Release Watch workflow — nothing new to
# configure. Safe to delete once no longer needed.
name: Scorecard Diagnostic Screenshot

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Market symbol to screenshot (e.g. XAUUSD)"
        required: false
        default: "XAUUSD"
      viewport:
        description: "Viewport preset (Phase 16 responsive QA)"
        required: false
        default: "desktop"
        type: choice
        options: ["desktop", "tablet", "iphone", "android"]

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@latest
          npx playwright install --with-deps chromium

      - name: Load the diagnostic page and capture screenshot + data
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          DIAG_KEY: ${{ secrets.EVENT_WATCH_SECRET }}
          SYMBOL: ${{ github.event.inputs.symbol }}
          VIEWPORT: ${{ github.event.inputs.viewport }}
        run: |
          cat > script.mjs <<'SCRIPT'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const baseUrl = process.env.APP_BASE_URL;
          const key = process.env.DIAG_KEY;
          const symbol = process.env.SYMBOL || "XAUUSD";
          const VIEWPORTS = {
            desktop: { width: 1320, height: 1200 },
            tablet: { width: 768, height: 1400 },
            iphone: { width: 390, height: 1800 },
            android: { width: 360, height: 1800 },
          };
          const viewport = VIEWPORTS[process.env.VIEWPORT] ?? VIEWPORTS.desktop;
          if (!baseUrl || !key) {
            console.error("APP_BASE_URL or DIAG_KEY (EVENT_WATCH_SECRET) is not set.");
            process.exit(1);
          }
          const url = `${baseUrl}/diagnostics/scorecard/${symbol}?key=${encodeURIComponent(key)}`;

          const browser = await chromium.launch();
          const page = await browser.newPage({ viewport });

          let response;
          try {
            response = await page.goto(url, { waitUntil: "load", timeout: 60000 });
          } catch (err) {
            console.error("NAVIGATION_FAILED:", err.message);
            await browser.close();
            process.exit(1);
          }
          console.log("HTTP_STATUS:", response.status());

          if (response.status() !== 200) {
            const body = await page.content();
            fs.writeFileSync("scorecard-error.html", body);
            console.log("BEGIN_ERROR_HTML");
            console.log(body.slice(0, 20000));
            console.log("END_ERROR_HTML");
            await browser.close();
            process.exit(1);
          }

          // Let client-side hydration + the recharts score-history SVG finish
          // rendering before capturing.
          await page.waitForTimeout(2500).catch(() => {});

          // Phase 16 responsive QA: does anything push past the viewport's
          // own width at this size (clipped scorecard rows, tables, etc.)?
          const overflow = await page.evaluate(() => {
            const vw = document.documentElement.clientWidth;
            const offenders = [];
            for (const el of document.querySelectorAll("body *")) {
              const rect = el.getBoundingClientRect();
              if (rect.right > vw + 2 && rect.width > 0) {
                offenders.push({ tag: el.tagName, cls: (el.className || "").toString().slice(0, 100), right: Math.round(rect.right), width: Math.round(rect.width) });
              }
              if (offenders.length >= 10) break;
            }
            return { docScrollWidth: document.documentElement.scrollWidth, clientWidth: vw, offenders };
          });
          console.log("BEGIN_OVERFLOW");
          console.log(JSON.stringify(overflow, null, 2));
          console.log("END_OVERFLOW");

          await page.screenshot({ path: "scorecard.jpg", fullPage: true, type: "jpeg", quality: 55 });

          const bodyText = await page.evaluate(() => document.body.innerText);
          fs.writeFileSync("scorecard-text.txt", bodyText);

          const jsonText = await page.evaluate(() => {
            const pre = document.querySelector("details pre");
            return pre ? pre.textContent : null;
          });
          if (jsonText) fs.writeFileSync("scorecard-data.json", jsonText);

          await browser.close();

          console.log("BEGIN_JSON");
          console.log(jsonText ?? "null");
          console.log("END_JSON");

          console.log("BEGIN_TEXT");
          console.log(bodyText);
          console.log("END_TEXT");

          const b64 = fs.readFileSync("scorecard.jpg").toString("base64");
          console.log("SCREENSHOT_BYTE_LENGTH:", fs.statSync("scorecard.jpg").size, "BASE64_LENGTH:", b64.length);
          console.log("BEGIN_SCREENSHOT_B64");
          console.log(b64);
          console.log("END_SCREENSHOT_B64");

          console.log("DONE");
          SCRIPT
          node script.mjs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-diagnostic
          path: |
            scorecard.jpg
            scorecard-text.txt
            scorecard-data.json
            scorecard-error.html
          retention-days: 7
          if-no-files-found: warn
