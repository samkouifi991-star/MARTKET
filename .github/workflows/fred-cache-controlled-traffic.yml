# One-off, manually-triggered controlled-traffic generator for verifying
# the FRED Macro-State cross-request cache (see
# services/market-data/last-known-good.ts's getCachedStoredEconomicSeries).
# Repeatedly hits the read-only diagnostics/scorecard/[symbol] route (same
# EVENT_WATCH_SECRET-gated pattern as the other diagnostic workflows) for
# the 4 dual-economy FX pairs plus XAUUSD (a single-economy/USD-only
# instrument, per gold-macro.ts), simulating several AutoRefresh cycles.
# Compare economic_indicators call counts in pg_stat_statements before and
# after this run:
#   - the per-request cost should no longer scale with indicators x
#     countries the way the pre-batching code did
#   - a dual-economy FX pair (2 countries) should NOT cost roughly double
#     a single-economy instrument like XAUUSD (1 country) — this is the
#     direct production check for "FX base+quote must not double DB
#     traffic" (see last-known-good.ts / last-known-good.test.ts)
# Safe to delete once no longer needed.
name: FRED Cache Controlled Traffic

on:
  workflow_dispatch: {}

jobs:
  generate-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit each FX pair's Scorecard diagnostic page 10 times, plus a single-economy control
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          KEY: ${{ secrets.EVENT_WATCH_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$KEY" ]; then
            echo "APP_BASE_URL or KEY (EVENT_WATCH_SECRET) is not set."
            exit 1
          fi
          ENCODED_KEY=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['KEY']))")
          echo "BEGIN_TRAFFIC"
          for ROUND in $(seq 1 2); do
            for SYM in USDJPY GBPJPY AUDUSD EURGBP; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "${APP_BASE_URL}/diagnostics/scorecard/${SYM}?key=${ENCODED_KEY}")
              echo "round=${ROUND} symbol=${SYM} http_code=${STATUS}"
            done
          done
          echo "END_FX_TRAFFIC"
          for ROUND in $(seq 1 2); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 30 "${APP_BASE_URL}/diagnostics/scorecard/XAUUSD?key=${ENCODED_KEY}")
            echo "round=${ROUND} symbol=XAUUSD http_code=${STATUS}"
          done
          echo "END_TRAFFIC"

      - name: Verify FX dual-economy base+quote correctness (raw JSON spot-check)
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          KEY: ${{ secrets.EVENT_WATCH_SECRET }}
        run: |
          ENCODED_KEY=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['KEY']))")
          echo "BEGIN_FX_CORRECTNESS"
          for SYM in AUDUSD USDJPY GBPJPY EURGBP; do
            echo "--- ${SYM} ---"
            curl -s -m 30 "${APP_BASE_URL}/diagnostics/scorecard/${SYM}?key=${ENCODED_KEY}" \
              | python3 -c "import sys,html; print(html.unescape(sys.stdin.read()))" \
              | grep -A1 -E '"baseCurrency"|"quoteCurrency"|"economicGrowthQuote"|"inflationQuote"|"jobsMarketQuote"' \
              | grep -v '^--$'
          done
          echo "END_FX_CORRECTNESS"
