# One-off, manually-triggered Playwright screenshot capture for the FX
# Relative Scorecard verification (base + quote economy comparison on
# Growth/Inflation/Labor/Rates). This sandbox's own outbound network policy
# blocks *.vercel.app directly, so this reuses the established pattern from
# the other diagnostic workflows in this repo: a GitHub Actions runner
# (unrestricted egress) does the real work and the result is read back via
# the GitHub Actions artifact API instead of a direct fetch. Uses the same
# read-only diagnostics/scorecard/[symbol] route (gated by
# EVENT_WATCH_SECRET, same repo secret already configured for the other
# diagnostic workflows) that renders the exact same Scorecard component a
# real logged-in customer sees — no test account or session needed. Safe to
# delete once no longer needed.
name: FX Relative Scorecard Screenshot

on:
  workflow_dispatch: {}

jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (Chromium only)
        run: npx --yes playwright@1.48.0 install --with-deps chromium
      - name: Screenshot the Scorecard for each FX pair
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          KEY: ${{ secrets.EVENT_WATCH_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$KEY" ]; then
            echo "APP_BASE_URL or KEY (EVENT_WATCH_SECRET) is not set."
            exit 1
          fi
          mkdir -p shots
          cat > shot.js <<'EOF'
          const { chromium } = require("playwright");

          const symbols = ["USDJPY", "GBPJPY", "AUDUSD", "EURGBP"];

          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            for (const symbol of symbols) {
              const url = `${process.env.APP_BASE_URL}/diagnostics/scorecard/${symbol}?key=${process.env.KEY}`;
              console.log(`Loading ${symbol}...`);
              const response = await page.goto(url, { waitUntil: "networkidle", timeout: 60000 });
              console.log(`${symbol}: HTTP ${response.status()}`);
              // Jump straight to the macro comparison section (id="sc-macro")
              // so the dual-economy tables are visible without manual scroll.
              await page.evaluate(() => document.getElementById("sc-macro")?.scrollIntoView());
              await page.waitForTimeout(500);
              await page.screenshot({ path: `shots/${symbol}-macro.png`, fullPage: false });
              await page.evaluate(() => window.scrollTo(0, 0));
              await page.waitForTimeout(200);
              await page.screenshot({ path: `shots/${symbol}-full.png`, fullPage: true });
            }
            await browser.close();
          })().catch((err) => {
            console.error(err);
            process.exit(1);
          });
          EOF
          node shot.js
      - uses: actions/upload-artifact@v4
        with:
          name: fx-relative-scorecard-screenshots
          path: shots/
          retention-days: 3
